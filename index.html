<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ブラウザだけで動く、小さなメモアプリ" />
    <title>TestCodex Memo</title>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <p class="eyebrow">Vite learning project</p>
        <h1>メモ</h1>
        <p class="lead">
          メモはこのブラウザの中（localStorage）にだけ保存されます。パスワードなどの秘密情報は書かないでください。
        </p>
      </header>

      <form id="memo-form" class="memo-form" novalidate>
        <h2 id="form-heading">新しいメモ</h2>
        <label for="memo-title">タイトル（必須）</label>
        <input
          id="memo-title"
          name="title"
          type="text"
          maxlength="100"
          autocomplete="off"
          required
        />
        <label for="memo-body">本文</label>
        <textarea
          id="memo-body"
          name="body"
          rows="5"
          maxlength="10000"
        ></textarea>
        <div class="form-actions">
          <button id="submit-button" type="submit">追加</button>
          <button
            id="cancel-button"
            type="button"
            class="button-secondary"
            hidden
          >
            キャンセル
          </button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>

      <section class="memo-section" aria-labelledby="list-heading">
        <h2 id="list-heading">メモ一覧 <span id="memo-count"></span></h2>
        <p id="empty-message" class="empty-message">まだメモはありません。</p>
        <ul id="memo-list" class="memo-list"></ul>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
